name: Lunaris-AOSP 16.2 - Pixel 7

on:
workflow_dispatch:
inputs:

```
  DEVICE_NAME:
    description: "Device codename"
    required: true
    default: "panther"
    type: string

  PRODUCT_NAME:
    description: "Lunaris lunch target"
    required: true
    default: "lineage_panther-bp4a-user"
    type: string

  BUILD_COMMAND:
    description: "Build command"
    required: true
    default: "m bacon"
    type: string

  CLEAN_BUILD:
    description: "Clean build?"
    required: true
    default: "no"
    type: choice
    options:
      - "yes"
      - "no"
```

permissions:
contents: write

jobs:

# ============================================================

# BUILD

# ============================================================

build:

```
name: Build Lunaris-AOSP 16.2

runs-on: ubuntu-latest

timeout-minutes: 1440

concurrency:
  group: lunaris-panther
  cancel-in-progress: false

env:
  DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
  PRODUCT_NAME: ${{ inputs.PRODUCT_NAME }}
  BUILD_COMMAND: ${{ inputs.BUILD_COMMAND }}
  CLEAN_BUILD: ${{ inputs.CLEAN_BUILD }}

steps:

  # ---------------------------------------------------------
  # CHECKOUT
  # ---------------------------------------------------------

  - name: Checkout repository
    uses: actions/checkout@v4

  # ---------------------------------------------------------
  # VALIDATE CONFIGURATION
  # ---------------------------------------------------------

  - name: Validate Pixel 7 configuration
    shell: bash
    run: |
      set -e

      echo "Device:  $DEVICE_NAME"
      echo "Product: $PRODUCT_NAME"
      echo "Build:   $BUILD_COMMAND"
      echo "Clean:   $CLEAN_BUILD"

      if [[ "$DEVICE_NAME" != "panther" ]]; then
        echo "::error::This workflow is configured for Pixel 7 (panther)."
        exit 1
      fi

      if [[ "$PRODUCT_NAME" != "lineage_panther-bp4a-user" ]]; then
        echo "::error::Wrong Pixel 7 lunch target."
        echo "::error::Expected: lineage_panther-bp4a-user"
        exit 1
      fi

      if [[ -z "$BUILD_COMMAND" ]]; then
        echo "::error::BUILD_COMMAND cannot be empty."
        exit 1
      fi

      echo "Configuration looks good."

  # ---------------------------------------------------------
  # FREE DISK SPACE
  # ---------------------------------------------------------

  - name: Free disk space
    shell: bash
    run: |
      set -eux

      sudo rm -rf /usr/local/lib/android
      sudo rm -rf /usr/share/dotnet
      sudo rm -rf /opt/ghc
      sudo rm -rf /usr/local/share/powershell
      sudo rm -rf /usr/local/share/chromium
      sudo rm -rf /usr/local/lib/node_modules

      sudo docker system prune -af || true

      df -h

  # ---------------------------------------------------------
  # INSTALL ANDROID DEPENDENCIES
  # ---------------------------------------------------------

  - name: Install Android build dependencies
    shell: bash
    run: |
      set -eux

      sudo apt-get update

      sudo apt-get install -y \
        adb \
        bc \
        bison \
        build-essential \
        ccache \
        curl \
        flex \
        g++-multilib \
        gcc-multilib \
        git \
        git-lfs \
        gnupg \
        gperf \
        imagemagick \
        lib32ncurses-dev \
        lib32readline-dev \
        lib32z1-dev \
        libelf-dev \
        liblz4-tool \
        libncurses5-dev \
        libncurses-dev \
        libssl-dev \
        libxml2-utils \
        lzop \
        openjdk-17-jdk \
        pngcrush \
        rsync \
        schedtool \
        squashfs-tools \
        unzip \
        xsltproc \
        zip \
        zlib1g-dev

      git lfs install

  # ---------------------------------------------------------
  # INSTALL REPO
  # ---------------------------------------------------------

  - name: Install repo
    shell: bash
    run: |
      set -eux

      mkdir -p "${HOME}/bin"

      curl -fsSL \
        https://storage.googleapis.com/git-repo-downloads/repo \
        -o "${HOME}/bin/repo"

      chmod +x "${HOME}/bin/repo"

      echo "${HOME}/bin" >> "${GITHUB_PATH}"

  # ---------------------------------------------------------
  # CONFIGURE GIT
  # ---------------------------------------------------------

  - name: Configure Git
    shell: bash
    run: |
      set -eux

      git config --global user.name "GitHub Actions"
      git config --global user.email "actions@github.com"

  # ---------------------------------------------------------
  # INITIALIZE LUNARIS-AOSP
  # ---------------------------------------------------------

  - name: Initialize Lunaris-AOSP 16.2
    shell: bash
    run: |
      set -eux

      mkdir -p "${GITHUB_WORKSPACE}/android"

      cd "${GITHUB_WORKSPACE}/android"

      repo init \
        -u https://github.com/Lunaris-AOSP/android.git \
        -b 16.2 \
        --git-lfs

  # ---------------------------------------------------------
  # PIXEL 7 LOCAL MANIFEST
  # ---------------------------------------------------------

  - name: Create Pixel 7 local manifest
    shell: bash
    working-directory: android
    run: |
      set -eux

      mkdir -p .repo/local_manifests

      cat > .repo/local_manifests/pixel7.xml <<'EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <manifest>

        <!-- Pixel 7 / panther -->

        <project
          name="LineageOS/android_device_google_panther"
          path="device/google/pantah"
          revision="lineage-23.2"
          clone-depth="1" />

        <project
          name="LineageOS/android_device_google_gs201"
          path="device/google/gs201"
          revision="lineage-23.2"
          clone-depth="1" />

        <project
          name="LineageOS/android_kernel_google_gs201"
          path="kernel/google/gs201"
          revision="lineage-23.2"
          clone-depth="1" />

        <project
          name="TheMuppets/proprietary_vendor_google_panther"
          path="vendor/google/panther"
          revision="lineage-23.2"
          clone-depth="1" />

      </manifest>
      EOF

      echo "Pixel 7 manifest:"
      cat .repo/local_manifests/pixel7.xml

  # ---------------------------------------------------------
  # SYNC SOURCE
  # ---------------------------------------------------------

  - name: Sync Lunaris sources
    working-directory: android
    shell: bash
    run: |
      set -eux

      echo "Starting repository sync..."

      repo sync \
        --force-sync \
        --no-clone-bundle \
        --no-tags \
        --optimized-fetch \
        --prune \
        -j2

  # ---------------------------------------------------------
  # SETUP BUILD ENVIRONMENT
  # ---------------------------------------------------------

  - name: Setup build environment
    working-directory: android
    shell: bash
    run: |
      set -eux

      source build/envsetup.sh

      lunch "${PRODUCT_NAME}"

  # ---------------------------------------------------------
  # CLEAN BUILD
  # ---------------------------------------------------------

  - name: Clean build
    if: ${{ inputs.CLEAN_BUILD == 'yes' }}
    working-directory: android
    shell: bash
    run: |
      set -eux

      source build/envsetup.sh

      lunch "${PRODUCT_NAME}"

      make clean

  # ---------------------------------------------------------
  # BUILD
  # ---------------------------------------------------------

  - name: Build Lunaris-AOSP
    working-directory: android
    shell: bash
    run: |
      set -eux

      source build/envsetup.sh

      lunch "${PRODUCT_NAME}"

      echo
      echo "========================================"
      echo " Lunaris-AOSP 16.2"
      echo " Pixel 7 / panther"
      echo "========================================"
      echo
      echo "Product:"
      echo "${PRODUCT_NAME}"
      echo
      echo "Build command:"
      echo "${BUILD_COMMAND}"
      echo

      ${BUILD_COMMAND}

  # ---------------------------------------------------------
  # SHOW OUTPUT
  # ---------------------------------------------------------

  - name: List build output
    if: always()
    working-directory: android
    shell: bash
    run: |
      echo "Build output:"

      find "out/target/product/${DEVICE_NAME}" \
        -maxdepth 1 \
        -type f \
        -printf '%f\n' \
        2>/dev/null || true

  # ---------------------------------------------------------
  # UPLOAD ARTIFACTS
  # ---------------------------------------------------------

  - name: Upload ROM artifacts
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: lunaris-${{ inputs.DEVICE_NAME }}
      path: |
        android/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
        android/out/target/product/${{ inputs.DEVICE_NAME }}/*.img
        android/out/target/product/${{ inputs.DEVICE_NAME }}/*boot*.img
        android/out/target/product/${{ inputs.DEVICE_NAME }}/*vendor*.img
      if-no-files-found: warn
      retention-days: 7
```
