name: MosaicOS Pixel 7 Build (Android 17)

on:
  workflow_dispatch:
    inputs:
      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "panther"
        type: string
      PRODUCT_NAME:
        description: "Lunch target"
        required: true
        default: "lineage_panther-bp4a-user"
        type: string
      BUILD_COMMAND:
        description: "Build command"
        required: true
        default: "m bacon"
        type: string
      CLEAN_BUILD:
        description: "Clean build output before building?"
        required: true
        default: "no"
        type: choice
        options: ["no", "yes"]

permissions:
  contents: read

concurrency:
  group: mosaicos-panther-build
  cancel-in-progress: false

jobs:
  build:
    name: Build MosaicOS - Pixel 7 (Android 17)
    runs-on: self-hosted
    timeout-minutes: 99999
    permissions:
      contents: read

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Show runner information
        shell: bash
        run: |
          set -e
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Architecture: $(uname -m)"
          echo "CPU count: $(nproc --all)"
          free -h
          df -h

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          REQUIRED_CMDS="adb bc bison gcc g++ ccache curl flex gperf convert git git-lfs gpg lz4 lzop python3 pip3 rsync schedtool mksquashfs unzip xsltproc zip"
          MISSING=""
          for cmd in ${REQUIRED_CMDS}; do
            command -v "${cmd}" >/dev/null 2>&1 || MISSING="${MISSING} ${cmd}"
          done
          if [ -z "${MISSING}" ]; then
            echo "Required build tools already installed."
          else
            if [ "$(id -u)" -ne 0 ] && ! apt-get update >/tmp/apt_probe.log 2>&1; then
              echo "ERROR: Missing tools require apt-get, but the runner has no usable apt privileges."
              cat /tmp/apt_probe.log
              exit 1
            fi
            apt-get update
            apt-get install -y adb bc bison build-essential ccache curl flex g++ git git-lfs gnupg gperf imagemagick libelf-dev libncurses-dev libssl-dev libxml2-utils lz4 lzop python3 python3-pip python3-venv rsync schedtool squashfs-tools unzip xsltproc zip zlib1g-dev
          fi
          git lfs install --skip-repo

      - name: Verify persistent Android base tree
        shell: bash
        run: |
          set -e
          test -f build/envsetup.sh || {
            echo "ERROR: build/envsetup.sh is missing."
            echo "Bootstrap the persistent MosaicOS base Android tree once before using this workflow."
            exit 1
          }
          echo "Persistent base Android tree is available."

      - name: Overwrite Pixel 7 repositories and fetch kernel prebuilts
        shell: bash
        timeout-minutes: 240
        run: |
          set -euo pipefail

          replace_checkout() {
            local path="$1"
            local url="$2"
            local branch="$3"
            local old_path="${path}.old-for-replacement"

            echo "=============================================="
            echo "Project path : ${path}"
            echo "Remote URL   : ${url}"
            echo "Branch       : ${branch}"
            echo "=============================================="

            # This workflow intentionally replaces stale, incomplete, or dirty
            # checkouts. Moving first makes the replacement atomic enough to
            # preserve the original until the new clone has succeeded.
            rm -rf "${old_path}"
            if [ -e "${path}" ]; then
              mv "${path}" "${old_path}"
            fi

            mkdir -p "$(dirname "${path}")"
            if ! git clone --depth=1 --branch "${branch}" "${url}" "${path}"; then
              echo "Clone failed; restoring previous checkout."
              rm -rf "${path}"
              if [ -e "${old_path}" ]; then
                mv "${old_path}" "${path}"
              fi
              exit 1
            fi

            rm -rf "${old_path}"
            echo "Verified origin: $(git -C "${path}" remote get-url origin)"
            echo "Checked-out commit: $(git -C "${path}" rev-parse --short HEAD)"
          }

          # The LineageOS device trees and TheMuppets vendor blobs are GitHub repos.
          replace_checkout \
            "device/google/pantah" \
            "https://github.com/LineageOS/android_device_google_pantah.git" \
            "lineage-24.0"

          replace_checkout \
            "device/google/gs201" \
            "https://github.com/LineageOS/android_device_google_gs201.git" \
            "lineage-24.0"

          replace_checkout \
            "vendor/google/panther" \
            "https://github.com/TheMuppets/proprietary_vendor_google_panther.git" \
            "lineage-24.0"

          # The current BoardConfig explicitly reads this Google kernel-prebuilt path.
          replace_checkout \
            "device/google/pantah-kernels/6.1" \
            "https://android.googlesource.com/device/google/pantah-kernels/6.1" \
            "android15-qpr2-release"

      - name: Select and expose Pantah kernel module list
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_ROOT="device/google/pantah-kernels/6.1"
          MODULE_LIST="vendor_kernel_boot.modules.load"
          PREFERRED_PAYLOAD="${KERNEL_ROOT}/trunk-12709428"

          test -f build/envsetup.sh
          test -f device/google/pantah/panther/BoardConfig.mk
          test -f device/google/gs201/BoardConfig-common.mk
          test -f vendor/google/panther/BoardConfigVendor.mk
          test -d "${KERNEL_ROOT}"

          echo "=============================================="
          echo " Selecting Pantah kernel prebuilt payload"
          echo "=============================================="

          if [ -s "${PREFERRED_PAYLOAD}/${MODULE_LIST}" ]; then
            KERNEL_PAYLOAD="${PREFERRED_PAYLOAD}"
            echo "Using preferred payload: ${KERNEL_PAYLOAD}"
          else
            echo "Preferred payload is not available: ${PREFERRED_PAYLOAD}"
            echo "Finding a non-empty ${MODULE_LIST} in available payloads..."
            KERNEL_PAYLOAD="$(
              find "${KERNEL_ROOT}" -mindepth 2 -maxdepth 2 -type f -name "${MODULE_LIST}" -size +0c -printf '%h\n' \
                | sort \
                | tail -n 1
            )"
          fi

          if [ -z "${KERNEL_PAYLOAD:-}" ] || [ ! -s "${KERNEL_PAYLOAD}/${MODULE_LIST}" ]; then
            echo "ERROR: No usable ${MODULE_LIST} was found under ${KERNEL_ROOT}."
            echo "Available payload directories:"
            find "${KERNEL_ROOT}" -mindepth 1 -maxdepth 1 -type d -printf '  - %f\n' | sort || true
            exit 1
          fi

          echo "Selected kernel payload: ${KERNEL_PAYLOAD}"
          echo "Source module list: ${KERNEL_PAYLOAD}/${MODULE_LIST}"
          head -20 "${KERNEL_PAYLOAD}/${MODULE_LIST}"

          # BoardConfig-common.mk currently reads the root-level location.
          # Copy the selected versioned payload's module list to that expected path.
          cp -f "${KERNEL_PAYLOAD}/${MODULE_LIST}" "${KERNEL_ROOT}/${MODULE_LIST}"

          test -s "${KERNEL_ROOT}/${MODULE_LIST}"
          echo "Exposed required root-level module list: ${KERNEL_ROOT}/${MODULE_LIST}"

      - name: Setup Android build environment
        shell: bash
        run: |
          set -e
          echo "=============================================="
          echo " Android build environment"
          echo "=============================================="
          source build/envsetup.sh
          lunch "${{ inputs.PRODUCT_NAME }}"

      - name: Optional clean build
        if: ${{ inputs.CLEAN_BUILD == 'yes' }}
        shell: bash
        run: |
          set -e
          rm -rf out
          echo "Build output cleaned."

      - name: Build ROM
        shell: bash
        timeout-minutes: 720
        env:
          PRODUCT_NAME: ${{ inputs.PRODUCT_NAME }}
          BUILD_COMMAND: ${{ inputs.BUILD_COMMAND }}
        run: |
          set -e
          export BUILD_USERNAME="${GITHUB_ACTOR}"
          export BUILD_HOSTNAME="github-actions-arm64"
          source build/envsetup.sh
          lunch "${PRODUCT_NAME}"
          bash -c "${BUILD_COMMAND}"

      - name: Locate build artifacts
        if: always()
        shell: bash
        env:
          DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
        run: |
          OUT_DIR="out/target/product/${DEVICE_NAME}"
          echo "Output directory: ${OUT_DIR}"
          if [ -d "${OUT_DIR}" ]; then
            find "${OUT_DIR}" -maxdepth 2 -type f \( -name "*.zip" -o -name "*.img" -o -name "*.apk" -o -name "*.json" -o -name "*.txt" \) -print || true
            du -sh "${OUT_DIR}" 2>/dev/null || true
          else
            echo "Output directory does not exist."
          fi

      - name: Upload ROM artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mosaicos-${{ inputs.DEVICE_NAME }}-android17-build
          retention-days: 7
          if-no-files-found: warn
          path: |
            out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
            out/target/product/${{ inputs.DEVICE_NAME }}/*.img
            out/target/product/${{ inputs.DEVICE_NAME }}/*boot*.img
            out/target/product/${{ inputs.DEVICE_NAME }}/*vendor*.img
            out/target/product/${{ inputs.DEVICE_NAME }}/*.json

      - name: Show final disk usage
        if: always()
        shell: bash
        run: df -h
