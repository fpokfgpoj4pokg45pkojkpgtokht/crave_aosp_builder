
#
# Lunaris-AOSP 16.2 GSI Build
# Based on:
# https://github.com/fpokfgpoj4pokg45pkojkpgtokht/crave_aosp_builder
#
# GSI source/reference:
# https://github.com/Doze-off/Lunaris-AOSP_gsi
#
# SPDX-License-Identifier: Apache-2.0
#

name: Lunaris-AOSP 16.2 - GSI Build

on:
  workflow_dispatch:
    inputs:
      LUNARIS_BRANCH:
        description: "Lunaris-AOSP branch"
        required: true
        default: "16.2"
        type: string

      BUILD_COMMAND:
        description: "Build command"
        required: true
        default: "m systemimage"
        type: string

      CLEAN_BUILD:
        description: "Clean build output before building?"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: lunaris-gsi-16.2
  cancel-in-progress: false

jobs:
  build:
    name: Build Lunaris-AOSP 16.2 GSI
    runs-on: self-hosted
    timeout-minutes: 99999

    permissions:
      contents: read

    steps:

      # ------------------------------------------------------------
      # CHECKOUT WORKFLOW REPOSITORY
      # ------------------------------------------------------------

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          clean: false

      # ------------------------------------------------------------
      # RUNNER INFORMATION
      # ------------------------------------------------------------

      - name: Show runner information
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "Lunaris-AOSP GSI Build"
          echo "=============================================="

          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Architecture: $(uname -m)"
          echo "CPU count: $(nproc --all)"

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

      # ------------------------------------------------------------
      # VERIFY AMD64/X86_64 RUNNER
      # ------------------------------------------------------------

      - name: Verify amd64 runner
        shell: bash
        run: |
          set -e

          ARCH="$(uname -m)"

          echo "Detected architecture: ${ARCH}"

          if [ "${ARCH}" != "x86_64" ]; then
            echo "ERROR: This workflow requires an amd64/x86_64 runner."
            exit 1
          fi

          echo "amd64/x86_64 runner confirmed."

      # ------------------------------------------------------------
      # BUILD DEPENDENCIES
      # ------------------------------------------------------------

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -e

          export DEBIAN_FRONTEND=noninteractive

          REQUIRED_CMDS="
            adb
            bc
            bison
            gcc
            g++
            ccache
            curl
            flex
            gperf
            convert
            git
            git-lfs
            gpg
            lz4
            lzop
            python3
            pip3
            rsync
            schedtool
            mksquashfs
            unzip
            xsltproc
            zip
          "

          MISSING=""

          for cmd in ${REQUIRED_CMDS}; do
            command -v "${cmd}" >/dev/null 2>&1 || \
              MISSING="${MISSING} ${cmd}"
          done

          if [ -z "${MISSING}" ]; then
            echo "All required build tools are already installed."
          else
            echo "Missing:${MISSING}"

            if [ "$(id -u)" -ne 0 ]; then
              echo "Checking apt permissions..."

              if ! apt-get update >/tmp/apt_probe.log 2>&1; then
                echo
                echo "ERROR: Missing packages require apt."
                echo "The self-hosted runner does not have usable apt privileges."
                echo
                cat /tmp/apt_probe.log
                exit 1
              fi
            fi

            apt-get update

            apt-get install -y \
              adb \
              bc \
              bison \
              build-essential \
              ccache \
              curl \
              flex \
              g++ \
              git \
              git-lfs \
              gnupg \
              gperf \
              imagemagick \
              libelf-dev \
              libncurses-dev \
              libssl-dev \
              libxml2-utils \
              lz4 \
              lzop \
              python3 \
              python3-pip \
              python3-venv \
              rsync \
              schedtool \
              squashfs-tools \
              unzip \
              xsltproc \
              zip \
              zlib1g-dev
          fi

          git lfs install --skip-repo

      # ------------------------------------------------------------
      # REPO TOOL
      # ------------------------------------------------------------

      - name: Install repo tool
        shell: bash
        run: |
          set -e

          mkdir -p "${HOME}/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod +x "${HOME}/bin/repo"

          echo "${HOME}/bin" >> "${GITHUB_PATH}"

          export PATH="${HOME}/bin:${PATH}"

          repo --version

      # ------------------------------------------------------------
      # GIT CONFIGURATION
      # ------------------------------------------------------------

      - name: Configure Git
        shell: bash
        run: |
          set -e

          git config --global user.name "${GITHUB_ACTOR}"

          git config --global user.email \
            "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

          git config --global protocol.version 2

          git config --global fetch.parallel 8

          git config --global lfs.concurrenttransfers 4

      # ------------------------------------------------------------
      # INITIALIZE LUNARIS
      # ------------------------------------------------------------

      - name: Initialize Lunaris AOSP
        shell: bash
        env:
          LUNARIS_BRANCH: ${{ inputs.LUNARIS_BRANCH }}
        run: |
          set -e

          export PATH="${HOME}/bin:${PATH}"

          echo "=============================================="
          echo "Initializing Lunaris-AOSP"
          echo "Branch: ${LUNARIS_BRANCH}"
          echo "=============================================="

          repo init \
            -u https://github.com/Lunaris-AOSP/android \
            -b "${LUNARIS_BRANCH}" \
            --git-lfs

      # ------------------------------------------------------------
      # SYNC SOURCE TREE
      # ------------------------------------------------------------

      - name: Sync Lunaris AOSP source
        shell: bash
        timeout-minutes: 1440
        run: |
          set -e

          export PATH="${HOME}/bin:${PATH}"

          echo "=============================================="
          echo "Synchronizing Lunaris source"
          echo "=============================================="

          repo sync \
            -c \
            -j"$(nproc --all)" \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch

      # ------------------------------------------------------------
      # VERIFY SOURCE
      # ------------------------------------------------------------

      - name: Verify Lunaris source tree
        shell: bash
        run: |
          set -e

          test -f build/envsetup.sh

          echo
          echo "Lunaris source tree detected."

          echo
          echo "Source directory:"
          pwd

          echo
          echo "Build system:"
          ls -lh build/envsetup.sh

      # ------------------------------------------------------------
      # FETCH DOZE-OFF GSI REPOSITORY
      #
      # IMPORTANT:
      # This repository is NOT the Android source tree.
      # It is the official GSI repository/reference containing
      # the Doze-off GSI information and TrebleDroid integration.
      # ------------------------------------------------------------

      - name: Fetch Doze-off Lunaris GSI repository
        shell: bash
        run: |
          set -e

          rm -rf .dozeoff-lunaris-gsi

          git clone \
            --depth=1 \
            https://github.com/Doze-off/Lunaris-AOSP_gsi.git \
            .dozeoff-lunaris-gsi

          echo
          echo "Doze-off repository:"
          git -C .dozeoff-lunaris-gsi log -1 --oneline

          echo
          echo "Files:"
          find .dozeoff-lunaris-gsi \
            -maxdepth 2 \
            -type f \
            -print

      # ------------------------------------------------------------
      # CHECK GSI TARGETS
      # ------------------------------------------------------------

      - name: Inspect available GSI targets
        shell: bash
        run: |
          set -e

          source build/envsetup.sh

          echo "=============================================="
          echo "Searching for GSI targets"
          echo "=============================================="

          lunch --help 2>/dev/null || true

          echo
          echo "Potential GSI products:"

          find device -type f \
            \( -name "*gsi*.mk" -o -name "*treble*.mk" \) \
            -print 2>/dev/null | head -100 || true

          echo
          echo "Available lunch targets containing GSI/Treble:"

          lunch 2>&1 | \
            grep -Ei "gsi|treble" | \
            head -100 || true

      # ------------------------------------------------------------
      # SELECT GENERIC ARM64 GSI
      #
      # We deliberately do NOT use:
      #   lunaris_panther-userdebug
      #
      # because this workflow is building a generic system image.
      # ------------------------------------------------------------

      - name: Select generic arm64 GSI target
        shell: bash
        run: |
          set -e

          source build/envsetup.sh

          echo "=============================================="
          echo "Selecting GSI target"
          echo "=============================================="

          TARGET=""

          for candidate in \
            "aosp_arm64-userdebug" \
            "aosp_arm64-user" \
            "lineage_arm64-userdebug" \
            "lineage_arm64-user"
          do
            if lunch "${candidate}" >/tmp/lunch-test.log 2>&1; then
              TARGET="${candidate}"
              echo "Selected target: ${TARGET}"
              break
            fi

            cat /tmp/lunch-test.log || true
          done

          if [ -z "${TARGET}" ]; then
            echo
            echo "ERROR: Could not find a generic arm64
```
