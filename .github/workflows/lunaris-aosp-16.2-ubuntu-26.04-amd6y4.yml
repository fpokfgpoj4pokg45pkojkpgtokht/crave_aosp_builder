name: Lunaris-AOSP 16.2 - Pixel 7 or Panther Build

on:
  workflow_dispatch:
    inputs:
      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "panther"
        type: string

      PRODUCT_NAME:
        description: "Optional exact lunch target. Leave blank to auto-detect Panther."
        required: false
        default: ""
        type: string

      BUILD_COMMAND:
        description: "Build command"
        required: true
        default: "m bacon"
        type: string

      LUNARIS_BRANCH:
        description: "Lunaris-AOSP branch"
        required: true
        default: "16.2"
        type: string

      CLEAN_BUILD:
        description: "Clean build output before building?"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: lunaris-panther-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Lunaris-AOSP 16.2 - Pixel 7 (Panther)
    runs-on: self-hosted
    timeout-minutes: 99999

    permissions:
      contents: read

    steps:

      # ============================================================
      # Checkout workflow repository
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          clean: false

      # ============================================================
      # Runner information
      # ============================================================

      - name: Show runner information
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo " Lunaris-AOSP ARM64 Build Runner"
          echo "=============================================="

          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Architecture: $(uname -m)"
          echo "CPU count: $(nproc --all)"

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

      # ============================================================
      # Android build dependencies
      # ============================================================

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -e

          export DEBIAN_FRONTEND=noninteractive

          REQUIRED_CMDS="
            adb
            bc
            bison
            gcc
            g++
            ccache
            curl
            flex
            gperf
            convert
            git
            git-lfs
            gpg
            lz4
            lzop
            python3
            pip3
            rsync
            schedtool
            mksquashfs
            unzip
            xsltproc
            zip
          "

          MISSING=""

          for cmd in ${REQUIRED_CMDS}; do
            if ! command -v "${cmd}" >/dev/null 2>&1; then
              MISSING="${MISSING} ${cmd}"
            fi
          done

          if [ -z "${MISSING}" ]; then
            echo "Required build tools already installed."
          else
            echo "Missing:${MISSING}"

            if [ "$(id -u)" -ne 0 ]; then
              if ! sudo -n apt-get update >/tmp/apt_probe.log 2>&1; then
                echo "ERROR: Missing tools require apt-get, but the runner has no usable sudo/apt privileges."
                cat /tmp/apt_probe.log
                exit 1
              fi
            fi

            sudo apt-get update

            sudo apt-get install -y \
              adb \
              bc \
              bison \
              build-essential \
              ccache \
              curl \
              flex \
              g++ \
              git \
              git-lfs \
              gnupg \
              gperf \
              imagemagick \
              libelf-dev \
              libncurses-dev \
              libssl-dev \
              libxml2-utils \
              lz4 \
              lzop \
              python3 \
              python3-pip \
              python3-venv \
              rsync \
              schedtool \
              squashfs-tools \
              unzip \
              xsltproc \
              zip \
              zlib1g-dev
          fi

          git lfs install --skip-repo

      # ============================================================
      # repo
      # ============================================================

      - name: Install repo tool
        shell: bash
        run: |
          set -e

          mkdir -p "${HOME}/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod +x "${HOME}/bin/repo"

          echo "${HOME}/bin" >> "${GITHUB_PATH}"

          export PATH="${HOME}/bin:${PATH}"

          repo --version

      # ============================================================
      # Git configuration
      # ============================================================

      - name: Configure Git for GitHub sources
        shell: bash
        run: |
          set -e

          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

          git config --global protocol.version 2
          git config --global fetch.parallel 8
          git config --global lfs.concurrenttransfers 4

      # ============================================================
      # Initialize Lunaris manifest
      # ============================================================

      - name: Initialize Lunaris AOSP manifest
        shell: bash
        env:
          LUNARIS_BRANCH: ${{ inputs.LUNARIS_BRANCH }}
        run: |
          set -e

          export PATH="${HOME}/bin:${PATH}"

          echo "=============================================="
          echo " Initializing Lunaris-AOSP"
          echo " Branch: ${LUNARIS_BRANCH}"
          echo "=============================================="

          repo init \
            -u https://github.com/Lunaris-AOSP/android \
            -b "${LUNARIS_BRANCH}" \
            --git-lfs

      # ============================================================
      # Sync source tree
      #
      # This is intentionally explicit.
      #
      # The previous workflow assumed that a persistent source tree
      # was already present and only repaired build/make + build/soong.
      # That could leave an incomplete manifest checkout.
      # ============================================================

      - name: Sync Lunaris AOSP source tree
        shell: bash
        timeout-minutes: 360
        run: |
          set -e

          export PATH="${HOME}/bin:${PATH}"

          echo "=============================================="
          echo " Syncing Lunaris-AOSP source tree"
          echo "=============================================="

          repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --retry-fetches=5 \
            -j"$(nproc --all)"

      # ============================================================
      # Verify base Android tree
      # ============================================================

      - name: Verify Android build tree
        shell: bash
        run: |
          set -e

          test -f build/envsetup.sh

          if [ -L build/envsetup.sh ]; then
            echo "build/envsetup.sh:"
            ls -la build/envsetup.sh
            echo "Resolves to:"
            readlink -f build/envsetup.sh
          fi

          test -f build/make/envsetup.sh
          test -d build/soong

          echo "Android build environment is present."

      # ============================================================
      # Replace Pixel 7 repositories
      #
      # IMPORTANT:
      #
      # Do NOT silently fall back to an unrelated Android branch.
      # The old workflow did this:
      #
      #   Lunaris 16.2 -> LineageOS lineage-24.0
      #
      # That can create an incompatible mixed tree.
      # ============================================================

      - name: Checkout Pixel 7 device repositories
        shell: bash
        timeout-minutes: 240
        env:
          LUNARIS_BRANCH: ${{ inputs.LUNARIS_BRANCH }}
        run: |
          set -euo pipefail

          replace_checkout() {
            local path="$1"
            local url="$2"
            local branch="$3"

            echo
            echo "=============================================="
            echo "Project path : ${path}"
            echo "Remote URL   : ${url}"
            echo "Branch       : ${branch}"
            echo "=============================================="

            rm -rf "${path}"

            mkdir -p "$(dirname "${path}")"

            git clone \
              --depth=1 \
              --branch "${branch}" \
              "${url}" \
              "${path}"

            git -C "${path}" lfs pull || true

            echo "Verified origin:"
            git -C "${path}" remote get-url origin

            echo "Checked-out commit:"
            git -C "${path}" rev-parse --short HEAD
          }

          clone_lunaris_only() {
            local path="$1"
            local lunaris_repo="$2"

            echo
            echo "Checking Lunaris repository:"
            echo "${lunaris_repo}"

            if ! git ls-remote \
              --exit-code \
              --heads \
              "${lunaris_repo}" \
              "${LUNARIS_BRANCH}" >/dev/null 2>&1; then

              echo
              echo "ERROR:"
              echo "The repository does not contain the requested Lunaris branch."
              echo
              echo "Repository: ${lunaris_repo}"
              echo "Branch:     ${LUNARIS_BRANCH}"
              echo
              echo "The workflow will NOT silently substitute a LineageOS branch."
              echo
              exit 1
            fi

            replace_checkout \
              "${path}" \
              "${lunaris_repo}" \
              "${LUNARIS_BRANCH}"
          }

          clone_lunaris_only \
            "device/google/pantah" \
            "https://github.com/Lunaris-AOSP/android_device_google_pantah.git"

          clone_lunaris_only \
            "device/google/gs201" \
            "https://github.com/Lunaris-AOSP/android_device_google_gs201.git"

          clone_lunaris_only \
            "vendor/google/panther" \
            "https://github.com/Lunaris-AOSP/proprietary_vendor_google_panther.git"

      # ============================================================
      # Kernel repository
      # ============================================================

      - name: Checkout Pantah kernel prebuilts
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_ROOT="device/google/pantah-kernels/6.1"

          rm -rf "${KERNEL_ROOT}"

          mkdir -p "$(dirname "${KERNEL_ROOT}")"

          git clone \
            --depth=1 \
            --branch android15-qpr2-release \
            https://android.googlesource.com/device/google/pantah-kernels/6.1 \
            "${KERNEL_ROOT}"

          test -d "${KERNEL_ROOT}"

          echo "Kernel repository:"
          git -C "${KERNEL_ROOT}" remote get-url origin

          echo "Kernel commit:"
          git -C "${KERNEL_ROOT}" rev-parse --short HEAD

      # ============================================================
      # Verify Panther repositories before envsetup
      # ============================================================

      - name: Verify Panther device tree
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " Verifying Panther source tree"
          echo "=============================================="

          test -d device/google/pantah
          test -d device/google/pantah/panther
          test -d device/google/gs201
          test -d vendor/google/panther

          test -f device/google/pantah/panther/BoardConfig.mk
          test -f device/google/gs201/BoardConfig-common.mk
          test -f vendor/google/panther/BoardConfigVendor.mk

          echo "Panther BoardConfig:"
          ls -la device/google/pantah/panther/BoardConfig.mk

          echo
          echo "Panther product-related files:"
          find device/google/pantah/panther \
            -maxdepth 2 \
            -type f \
            \( \
              -name "*.mk" \
              -o -name "*.bp" \
              -o -name "*.xml" \
            \) \
            -print | sort

      # ============================================================
      # Select kernel module list
      # ============================================================

      - name: Select and expose Pantah kernel module list
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_ROOT="device/google/pantah-kernels/6.1"
          MODULE_LIST="vendor_kernel_boot.modules.load"
          PREFERRED_PAYLOAD="${KERNEL_ROOT}/trunk-12709428"

          test -d "${KERNEL_ROOT}"

          if [ -s "${PREFERRED_PAYLOAD}/${MODULE_LIST}" ]; then
            KERNEL_PAYLOAD="${PREFERRED_PAYLOAD}"
          else
            KERNEL_PAYLOAD="$(
              find "${KERNEL_ROOT}" \
                -mindepth 2 \
                -maxdepth 2 \
                -type f \
                -name "${MODULE_LIST}" \
                -size +0c \
                -printf '%h\n' |
              sort |
              tail -n 1
            )"
          fi

          if [ -z "${KERNEL_PAYLOAD:-}" ] ||
             [ ! -s "${KERNEL_PAYLOAD}/${MODULE_LIST}" ]; then

            echo "ERROR: No usable ${MODULE_LIST} found."

            find "${KERNEL_ROOT}" \
              -mindepth 1 \
              -maxdepth 2 \
              -type f \
              -name "${MODULE_LIST}" \
              -print || true

            exit 1
          fi

          echo "Selected kernel payload:"
          echo "${KERNEL_PAYLOAD}"

          cp -f \
            "${KERNEL_PAYLOAD}/${MODULE_LIST}" \
            "${KERNEL_ROOT}/${MODULE_LIST}"

          test -s "${KERNEL_ROOT}/${MODULE_LIST}"

          echo
          echo "Exposed:"
          echo "${KERNEL_ROOT}/${MODULE_LIST}"

      # ============================================================
      # Discover actual Panther lunch target
      #
      # THIS IS THE IMPORTANT FIX.
      #
      # We do not assume:
      #
      #   lunaris_panther-bp4a-userdebug
      #
      # We ask the checked-out source tree what products it actually
      # provides.
      # ============================================================

      - name: Discover Panther lunch target
        id: discover_product
        shell: bash
        env:
          REQUESTED_PRODUCT: ${{ inputs.PRODUCT_NAME }}
          DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
        run: |
          set -e

          # envsetup can execute pipelines that intentionally terminate
          # early. Do not let pipefail turn those into false failures.
          set +o pipefail

          source build/envsetup.sh

          echo "=============================================="
          echo " Discovering Android products"
          echo "=============================================="

          LUNCH_OUTPUT="$(lunch 2>&1 || true)"

          echo "${LUNCH_OUTPUT}"

          echo
          echo "=============================================="
          echo " Panther candidates"
          echo "=============================================="

          PANHTER_COMBOS="$(
            printf '%s\n' "${LUNCH_OUTPUT}" |
              grep -iE '(^|[^[:alnum:]_])panther([^[:alnum:]_]|$)' |
              sed 's/^[[:space:]]*//' |
              sort -u || true
          )"

          if [ -n "${PANHTER_COMBOS}" ]; then
            echo "${PANHTER_COMBOS}"
          else
            echo "No Panther lunch entries were displayed."
          fi

          # ----------------------------------------------------------
          # If the user supplied an exact PRODUCT_NAME, verify it.
          # ----------------------------------------------------------

          if [ -n "${REQUESTED_PRODUCT}" ]; then
            echo
            echo "Requested product:"
            echo "${REQUESTED_PRODUCT}"

            if printf '%s\n' "${LUNCH_OUTPUT}" |
              grep -Fq "${REQUESTED_PRODUCT}"; then

              PRODUCT="${REQUESTED_PRODUCT}"

            else
              echo
              echo "ERROR: Requested PRODUCT_NAME is not present in the lunch menu."
              echo
              echo "Requested:"
              echo "${REQUESTED_PRODUCT}"
              echo
              echo "Available Panther candidates:"
              echo "${PANHTER_COMBOS:-NONE}"
              echo
              exit 1
            fi

          else

            # --------------------------------------------------------
            # Try to derive a valid product from PRODUCT_DEVICE.
            #
            # Search the Android make/product definitions rather than
            # inventing a lunch name.
            # --------------------------------------------------------

            PRODUCT_FILES="$(
              grep -RIl \
                --exclude-dir=.git \
                --exclude-dir=out \
                -E \
                'PRODUCT_DEVICE[[:space:]]*:?=[[:space:]]*panther' \
                device vendor 2>/dev/null |
              sort -u || true
            )"

            echo
            echo "Files declaring PRODUCT_DEVICE := panther:"
            echo "${PRODUCT_FILES:-NONE}"

            PRODUCT_NAMES="$(
              for f in ${PRODUCT_FILES}; do
                grep -hE \
                  '^[[:space:]]*PRODUCT_NAME[[:space:]]*:?=' \
                  "${f}" 2>/dev/null || true
              done |
              sed -E \
                's/^[[:space:]]*PRODUCT_NAME[[:space:]]*:?[=][[:space:]]*//' |
              sed 's/[[:space:]]*#.*$//' |
              sed '/^[[:space:]]*$/d' |
              sort -u
            )"

            echo
            echo "Product names associated with Panther:"
            echo "${PRODUCT_NAMES:-NONE}"

            # --------------------------------------------------------
            # Prefer an explicit lunch combo from lunch output.
            # --------------------------------------------------------

            CANDIDATE="$(
              printf '%s\n' "${PANHTER_COMBOS}" |
                grep -E \
                  '^[[:alnum:]_.+-]+-[[:alnum:]_.+-]+-[[:alnum:]_.+-]+$' |
                head -n 1 || true
            )"

            if [ -n "${CANDIDATE}" ]; then
              PRODUCT="${CANDIDATE}"

            else
              echo
              echo "ERROR: Could not automatically determine a valid Panther lunch target."
              echo
              echo "This means the checked-out Lunaris-AOSP tree does not expose"
              echo "a normal Panther lunch product, or its product definition"
              echo "uses a structure this discovery logic cannot identify."
              echo
              echo "Available lunch entries containing Panther:"
              echo "${PANHTER_COMBOS:-NONE}"
              echo
              echo "Panther PRODUCT_DEVICE definitions:"
              echo "${PRODUCT_NAMES:-NONE}"
              echo
              exit 1
            fi
          fi

          echo
          echo "=============================================="
          echo " Selected product"
          echo "=============================================="
          echo "${PRODUCT}"

          # ----------------------------------------------------------
          # Validate the selected product using Soong's own dumpvars.
          # ---
